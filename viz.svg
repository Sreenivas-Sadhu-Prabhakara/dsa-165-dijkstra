<text x="56.0" y="585.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Distances: [0, 3, 1, 4]. Stale heap entries are simply skipped on pop (lazy</text>
<text x="56.0" y="604.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">deletion) — simpler than a decrease-key heap and the same O(E log V).</text>
